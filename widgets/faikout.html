<!--
    ioBroker.faikout - Widgets fuer VIS 1.x

    Die Kachel ist in einzeln platzierbare Bausteine zerlegt: Bogen, Betriebsart, Luefter,
    Leistungsbegrenzung, Zusatzfunktionen, Messwerte-Block und Einzelwert. Dazu gibt es die
    komplette Kachel als ein Stueck.

    Jeder Baustein braucht nur EIN Attribut: das Geraeteobjekt (faikout.0.<Name>). Welche
    Datenpunkte darunter liegen, findet das Widget selbst heraus - fehlt einer, sagt es das,
    statt ein totes Bedienelement zu zeigen.
-->
